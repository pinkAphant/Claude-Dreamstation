<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Dreamstation</title>
    <style>
      html, body { margin: 0; background: #0c0b0a; color: #8a877f; font: 12px ui-monospace, Menlo, monospace; }
      #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; max-width: 1200px; margin: auto; }
      canvas { width: 100%; height: auto; image-rendering: pixelated; display: block; outline: 2px solid #1b1a18; cursor: pointer; }
      canvas.on { outline-color: #d97757; }
      p { text-align: center; margin: 6px; }
    </style>
  </head>
  <body>
    <p>Click a screen or press 1-8 to pick it. Stick: WASD / arrows. Buttons: Space, E, Q, Shift (or the IJKL diamond).</p>
    <div id="grid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
